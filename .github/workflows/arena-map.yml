          arm-none-eabi-nm -n map-multi-dynamic-line-slots-source-trial/pokeemerald.elf \
            > artifact/SOURCE_MAP_MULTI_DYNAMIC_LINE_SLOTS.sym
          python3 tools/audit_source_font_layout.py \
            --rom map-multi-dynamic-line-slots-source-trial/pokeemerald.gba \
            --sym artifact/SOURCE_MAP_MULTI_DYNAMIC_LINE_SLOTS.sym \
            --out artifact/SOURCE_MAP_MULTI_DYNAMIC_LINE_SLOTS_FONT_AUDIT.json
          python3 tools/audit_source_rom_headroom.py \
            --elf map-multi-dynamic-line-slots-source-trial/pokeemerald.elf \
            --rom map-multi-dynamic-line-slots-source-trial/pokeemerald.gba \
            --minimum-free-bytes 1048576 \
            --out artifact/SOURCE_MAP_MULTI_DYNAMIC_LINE_SLOTS_HEADROOM.json
          python3 tools/verify_map_multi_dynamic_line_slots.py \
            --workspace map-multi-dynamic-line-slots-source-trial \
            --artifact artifact \
            --rom map-multi-dynamic-line-slots-source-trial/pokeemerald.gba \
            --sym artifact/SOURCE_MAP_MULTI_DYNAMIC_LINE_SLOTS.sym \
            --font-audit artifact/SOURCE_MAP_MULTI_DYNAMIC_LINE_SLOTS_FONT_AUDIT.json \
            --headroom artifact/SOURCE_MAP_MULTI_DYNAMIC_LINE_SLOTS_HEADROOM.json \
            --codebook checkpoints/v06-pokeblock-safe-codebook.json \
            --out artifact/SOURCE_MAP_MULTI_DYNAMIC_LINE_SLOTS_ATTESTATION.json
          echo "Multi-variable NPC page slots source-linked and ELF/GBA byte-attested without rewriting approved v0.4 font or user words." >> "$GITHUB_STEP_SUMMARY"

      - name: Bulk source-compile four-line Pokédex descriptions with original words
        run: |
          # Pokédex is a fixed original four-line C text window. Every
          # Vietnamese word must remain; unknown accented glyphs are skipped
          # until donor-compatible codebook+art are independently validated.
          cp -a map-multi-dynamic-line-slots-source-trial pokedex-four-line-source-trial
          python3 tools/stage_source_pokedex_text.py \
            --workspace pokedex-four-line-source-trial \
            --plan artifact/user-facing-integration-plan.json \
            --codebook checkpoints/v06-pokeblock-safe-codebook.json \
            --limit 450 --width 40 --apply \
            --report artifact/SOURCE_POKEDEX_FOUR_LINE_STAGE.json
          make -C pokedex-four-line-source-trial -j2
          test -s pokedex-four-line-source-trial/pokeemerald.gba
          arm-none-eabi-nm -n pokedex-four-line-source-trial/pokeemerald.elf \
            > artifact/SOURCE_POKEDEX_FOUR_LINE.sym
          python3 tools/audit_source_font_layout.py \
            --rom pokedex-four-line-source-trial/pokeemerald.gba \
            --sym artifact/SOURCE_POKEDEX_FOUR_LINE.sym \
            --out artifact/SOURCE_POKEDEX_FOUR_LINE_FONT_AUDIT.json
          python3 tools/audit_source_rom_headroom.py \
            --elf pokedex-four-line-source-trial/pokeemerald.elf \
            --rom pokedex-four-line-source-trial/pokeemerald.gba \
            --minimum-free-bytes 1048576 \
            --out artifact/SOURCE_POKEDEX_FOUR_LINE_HEADROOM.json
          python3 tools/verify_source_pokedex_four_line.py \
            --workspace pokedex-four-line-source-trial \
            --artifact artifact \
            --rom pokedex-four-line-source-trial/pokeemerald.gba \
            --sym artifact/SOURCE_POKEDEX_FOUR_LINE.sym \
            --font-audit artifact/SOURCE_POKEDEX_FOUR_LINE_FONT_AUDIT.json \
            --headroom artifact/SOURCE_POKEDEX_FOUR_LINE_HEADROOM.json \
            --codebook checkpoints/v06-pokeblock-safe-codebook.json \
            --out artifact/SOURCE_POKEDEX_FOUR_LINE_ATTESTATION.json
          echo "Pokédex source four-line translations relinked and ELF/GBA-byte verified; user-approved Vietnamese v0.4 font NOT present, gameplay QA pending." >> "$GITHUB_STEP_SUMMARY"

      - name: Independently compile safe literal-LF map texts (experimental; no donor font)
        run: |
          # Do not mutate source-localization-smoke: its independently pinned
          # 2,093-label SHA and SOURCE_LEVEL_FONT.sym are release blockers.
          cp -a workspace literal-lf-source-trial
          python3 tools/stage_source_map_translations.py \
            --workspace literal-lf-source-trial \
            --plan artifact/user-facing-integration-plan.json \
            --codebook checkpoints/v06-pokeblock-safe-codebook.json \
            --source-prefix data/maps/ \
            --only-literal-newlines \
            --normalize-literal-newlines \
            --auto-wrap \
            --limit 1000 \
            --apply \
            --report artifact/SOURCE_LITERAL_LF_TRIAL.json
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          from verify_compiled_source_strings import validate_stages
          d=json.loads(Path("artifact/SOURCE_LITERAL_LF_TRIAL.json").read_text())
          n=d["labels_staged"]
          assert d["mode"]=="apply" and 40<=n<=566, (n,d["skipped_reasons"])
          assert d["literal_newlines_normalized"]==n, d
          assert all(r["literal_newlines_normalized"] and
                     "\n" in r["authored_vietnamese"] and
                     r"\n" in r["vietnamese"]
                     for r in d["translated"]),"unproven literal-LF ownership"
          audited=validate_stages(Path("literal-lf-source-trial"),{"map":d})
          assert audited["checked_unique_source_labels"]==n, audited
          Path("artifact/SOURCE_LITERAL_LF_ATTESTATION.json").write_text(
              json.dumps(audited,indent=2)+"\n")
          print("PASS: independently validated",n,
                "source-owned additional literal-LF map text labels")
          PY
          python3 tools/apply_title_credit.py literal-lf-source-trial
          make -C literal-lf-source-trial -j2
          test -s literal-lf-source-trial/pokeemerald.gba
          sha256sum literal-lf-source-trial/pokeemerald.gba > artifact/SOURCE_LITERAL_LF_TRIAL_SHA256.txt
          arm-none-eabi-nm -n literal-lf-source-trial/pokeemerald.elf > artifact/SOURCE_LITERAL_LF_FONT.sym
          python3 tools/audit_source_font_layout.py \
            --rom literal-lf-source-trial/pokeemerald.gba \
            --sym artifact/SOURCE_LITERAL_LF_FONT.sym \
            --out artifact/SOURCE_LITERAL_LF_FONT_AUDIT.json
          echo "Separate opt-in literal-LF trial built and source-attested; stock font raster, NO emulator QA, NOT release-ready." >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-build Votri Valley title credit
        run: |
          cp -a workspace credit-workspace
          python3 tools/apply_title_credit.py credit-workspace
          make -C credit-workspace -j2
          test -s credit-workspace/pokeemerald.gba
          cp credit-workspace/graphics/title_screen/translation_credit.png artifact/title-translation-credit.png
          sha256sum credit-workspace/pokeemerald.gba > artifact/TITLE_CREDIT_BUILD_SHA256.txt
          echo "Title credit source patch compiled successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "Visible credit: **Việt hóa bởi Votri Valley**" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-0.13.0-symbol-map
          path: artifact/
          retention-days: 7
