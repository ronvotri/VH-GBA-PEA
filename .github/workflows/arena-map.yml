            --priority-source-prefix data/text/trainers.inc \
            --limit 500 \
            --auto-wrap \
            --apply \
            --report artifact/SOURCE_SYSTEM_TEXT_STAGE.json
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          from verify_compiled_source_strings import validate_stages
          folder=Path("artifact")
          stage=json.loads((folder/"SOURCE_SYSTEM_TEXT_STAGE.json").read_text())
          base=json.loads((folder/"SOURCE_EXPANDED_MAP_ATTESTATION.json").read_text())
          n=stage["labels_staged"]
          assert stage["mode"]=="apply" and stage["category"]=="system-text",stage
          assert stage["explicit_owned_label_exclusions"]==3,stage
          assert 150<=n<=500,stage
          assert base["combined_distinct_compiled_labels"]==2560,base
          assert all(row["source_file"].startswith("data/text/")
                     for row in stage["translated"])
          # The greeting visibly stayed English in the previous six-frame
          # emulator inspection; pin its exact owner and revised source text.
          greetings=[row for row in stage["translated"]
                     if row["label"]=="gText_Birch_Welcome"]
          assert len(greetings)==1 and greetings[0]["source_file"]=="data/text/birch_speech.inc",greetings
          assert "Ta là BIRCH." in greetings[0]["vietnamese"],greetings
          assert "giáo sư POKéMON." in greetings[0]["vietnamese"],greetings
          original_names={
              "map":"SOURCE_LEVEL_VIETNAMESE_PILOT.json",
              "ui":"SOURCE_LEVEL_UI_PILOT.json",
              "dynamic":"SOURCE_LEVEL_DYNAMIC_PILOT.json",
              "battle":"SOURCE_LEVEL_BATTLE_PILOT.json",
              "battle-c":"SOURCE_LEVEL_BATTLE_C_PILOT.json",
              "move-desc":"SOURCE_LEVEL_MOVE_DESC_PILOT.json",
              "item-desc":"SOURCE_LEVEL_ITEM_DESC_PILOT.json",
              "pokeblock":"SOURCE_LEVEL_POKEBLOCK_ITEM_PILOT.json",
          }
          old={k:json.loads((folder/v).read_text()) for k,v in original_names.items()}
          extra=[json.loads((folder/f).read_text()) for f in (
              "SOURCE_EXPANDED_MAP_STAGE.json","SOURCE_EXPANDED_MAP_LF_STAGE.json")]
          def labels(r,group="map"):
              return {item["label"] for item in
                      r["accepted" if group=="dynamic" else "translated"]}
          previous=set()
          for group,report in old.items():
              keys=labels(report,group)
              assert not previous & keys, "duplicate old label"
              previous |= keys
          for report in extra:
              keys=labels(report)
              assert not previous & keys,"map batch label overlap"
              previous |= keys
          current=labels(stage,"system-text")
          assert len(previous)==2560, len(previous)
          assert len(current)==n and not current & previous,"system-text overlaps old source"
          root=Path("expanded-system-text-source-trial")
          prior_qa=validate_stages(root,old)
          map_qa=[validate_stages(root,{"map":report}) for report in extra]
          text_qa=validate_stages(root,{"system-text":stage})
          assert prior_qa["checked_unique_source_labels"]==2093,prior_qa
          assert [q["checked_unique_source_labels"] for q in map_qa]==[292,175],map_qa
          assert text_qa["checked_unique_source_labels"]==n,text_qa
          attestation={"previous_compiled_source_labels":2560,
              "new_system_text_labels":n,"combined_distinct_compiled_labels":2560+n,
              "all_original_source_owners_revalidated":True,
              "no_cross_group_duplicates":True,"font_artwork_grafted":False,
              "emulator_tested":False,"release_ready":False}
          (folder/"SOURCE_SYSTEM_TEXT_ATTESTATION.json").write_text(
              json.dumps(attestation,ensure_ascii=False,indent=2)+"\n")
          print("PASS: independently source-attested system-text",n,
                "combined",2560+n)
          PY
