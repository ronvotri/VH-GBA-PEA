name: Build Arena symbol map

on:
  push:
    paths:
      - '.github/workflows/arena-map.yml'
      - 'tools/**'
      - 'translations/**'
  workflow_dispatch:

concurrency:
  group: arena-symbol-map-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-map:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Test integration planner safety
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 -m py_compile tools/apply_title_credit.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev git python3 python3-pip nodejs npm fonts-dejavu-core

      - name: Install current Pillow
        run: python3 -m pip install --user --upgrade Pillow

      - name: Checkout exact sources
        run: |
          git clone https://github.com/pret/pokeemerald.git workspace
          git -C workspace checkout 5eff78649e7170a877b961ef0b3da13b81a16038
          git clone https://github.com/pret/agbcc.git agbcc
          git -C agbcc checkout da598c1d918402c42c0c0d7128ba14567f3175e9
          git clone --branch v0.13.0 --depth 1 https://github.com/GBurgardt/pokemon-emerald-arena.git arena

      - name: Install agbcc
        run: |
          cd agbcc
          ./build.sh
          ./install.sh ../workspace

      - name: Apply Emerald Arena 0.13.0
        run: |
          git -C workspace apply ../arena/game/native-engine.patch
          cp -R arena/game/overlay/. workspace/
          # Arena's host-side asset packers use hypot()/math on Linux.
          sed -i 's/-lpng -o/-lpng -lm -o/g' workspace/tools/arena/dev.sh
          sed -i 's/-Werror //g' workspace/tools/arena/dev.sh
          # v0.13.0 source references this assembler label from C without a public declaration.
          sed -i '1i extern const unsigned char BattleScript_ArenaEvolutionLearn[];' workspace/src/arena_evolution.inc

      - name: Generate Arena assets
        working-directory: workspace
        run: ./tools/arena/dev.sh assets

      - name: Build Arena
        working-directory: workspace
        run: |
          make -j2
          echo "Built ROM hashes:"
          sha1sum pokeemerald.gba
          sha256sum pokeemerald.gba
          echo "Expected shipping Arena SHA256: a8d36c0c398f5281694c2d8dc5094a54a2276bd3092f5802cef6ef99369c645b"
          ls -lah pokeemerald.gba pokeemerald.elf pokeemerald.map || true

      - name: Collect non-ROM build metadata
        run: |
          mkdir -p artifact
          cp workspace/pokeemerald.map artifact/ 2>/dev/null || true
          arm-none-eabi-nm -n workspace/pokeemerald.elf > artifact/pokeemerald.sym
          sha1sum workspace/pokeemerald.gba > artifact/ROM_SHA1.txt
          sha256sum workspace/pokeemerald.gba > artifact/ROM_SHA256.txt

      - name: Build source-provenance text catalog
        run: |
          python3 tools/build_source_text_catalog.py \
            --workspace workspace \
            --sym artifact/pokeemerald.sym \
            --build-rom workspace/pokeemerald.gba \
            --out-csv artifact/text-catalog.csv \
            --out-json artifact/text-catalog.json \
            --summary artifact/text-catalog-summary.json

      - name: Restore verified shipping layout checkpoint
        run: |
          python3 tools/apply_shipping_layout_checkpoint.py \
            --catalog artifact/text-catalog.csv \
            --build-sha256-file artifact/ROM_SHA256.txt \
            --checkpoint checkpoints/shipping-layout-verification.json \
            --out-csv artifact/shipping-verified-text-catalog.csv \
            --out-json artifact/shipping-verified-text-catalog.json \
            --summary artifact/shipping-layout-summary.json

      - name: Audit remaining map/story catalog
        run: |
          python3 tools/audit_remaining_map_story.py \
            --catalog artifact/text-catalog.csv \
            --translations translations/map-story \
            --out artifact/map-story-remaining.json \
            --summary artifact/map-story-remaining-summary.txt

      - name: Validate Vietnamese translation manifests
        run: |
          python3 tools/validate_translation_manifest.py \
            --catalog artifact/text-catalog.csv \
            --translations translations

      - name: Audit exact translation coverage
        run: |
          python3 tools/audit_translation_coverage.py \
            --catalog artifact/text-catalog.csv \
            --translations translations \
            --out artifact/translation-coverage.json \
            --summary artifact/translation-coverage-summary.txt

      - name: Plan all user-facing integration
        run: |
          python3 tools/plan_user_facing_integration.py \
            --catalog artifact/shipping-verified-text-catalog.csv \
            --translations translations \
            --out artifact/user-facing-integration-plan.json \
            --summary artifact/user-facing-integration-summary.json

      - name: Publish safe integration readiness
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d = json.loads(Path("artifact/user-facing-integration-summary.json").read_text())
          print("### Emerald Arena — read-only integration readiness")
          print(f"Source/manifest coverage: **{d['translation_rows']:,}/{d['catalog_user_facing_rows']:,}**")
          print("| Check | Rows |")
          print("| --- | ---: |")
          for label, count in d["integration_status_counts"].items():
              print(f"| {label} | {count:,} |")
          for label, count in d.get("source_text_comparison_counts", {}).items():
              print(f"| {label} (NOT a v0.4 write decision) | {count:,} |")
          print(f"| Verified v0.4 bytes for safe no-op | {d.get('rows_safe_to_skip_binary_write', 0):,} |")
          print()
          print("No ROM write or pointer write. Source-identical is NOT automatically a v0.4 no-op.")
          PY

      - name: Plan map story integration
        run: |
          python3 tools/plan_map_story_integration.py \
            --catalog artifact/shipping-verified-text-catalog.csv \
            --translations translations/map-story \
            --out artifact/map-story-integration-plan.json \
            --summary artifact/map-story-integration-summary.json

      - name: Smoke-build story, UI, battle, move/item descriptions and Votri credit
        run: |
          cp -a workspace source-localization-smoke
          python3 tools/plan_collision_free_vietnamese_font.py \
            --codebook checkpoints/v04-inferred-vietnamese-codebook.json \
            --charmap source-localization-smoke/charmap.txt \
            --out-codebook artifact/COLLISION_SAFE_SOURCE_CODEBOOK.json \
            --report artifact/COLLISION_SAFE_SOURCE_CODEBOOK_QA.json
          python3 - <<'PY'
          import json
          book=json.load(open("artifact/COLLISION_SAFE_SOURCE_CODEBOOK.json"))
          pinned=json.load(open("checkpoints/v05-collision-free-codebook.json"))
          assert book["glyph_bytes"]==pinned["glyph_bytes"], "codebook drift against tracked v0.5 glyph plan"
          assert book["glyph_bytes"]["f"]=="0xDA"
          assert book["glyph_bytes"]["w"]=="0xEB"
          assert book["glyph_bytes"]["z"]=="0xEE"
          assert book["glyph_bytes"]["ấ"]=="0x30"
          assert book["glyph_bytes"]["ằ"]=="0x31"
          assert book["glyph_bytes"]["ắ"]=="0x32"
          assert "Ừ" not in book["glyph_bytes"]
          print("PASS: collision-free source codebook; FONT ASSETS NOT PATCHED")
          PY
          python3 tools/plan_v06_pokeblock_safe_font.py \
            --v05-codebook checkpoints/v05-collision-free-codebook.json \
            --charmap source-localization-smoke/charmap.txt \
            --out-codebook artifact/POKEBLOCK_SAFE_SOURCE_CODEBOOK.json \
            --report artifact/POKEBLOCK_SAFE_CODEBOOK_QA.json
          python3 - <<'PY'
          import json
          generated=json.load(open("artifact/POKEBLOCK_SAFE_SOURCE_CODEBOOK.json"))
          pinned=json.load(open("checkpoints/v06-pokeblock-safe-codebook.json"))
          assert generated["glyph_bytes"]==pinned["glyph_bytes"],"v0.6 source codebook drift"
          codes=generated["glyph_bytes"]
          assert codes["đ"]=="0x33" and codes["ì"]=="0x37"
          assert codes["ấ"]=="0x30" and codes["ằ"]=="0x31" and codes["ắ"]=="0x32"
          assert codes["f"]=="0xDA" and codes["w"]=="0xEB" and codes["z"]=="0xEE"
          assert not any(int(value,16) in range(0x53,0x5A)
                         for char,value in codes.items() if ord(char)>127)
          assert not any(int(value,16)==0x35 for char,value in codes.items() if char!="=")
          print("PASS: v0.6 Vietnamese codebook preserves POKEBLOCK, PKMN and =; FONT UNCHANGED")
          PY
          python3 tools/stage_source_map_translations.py \
            --workspace source-localization-smoke \
            --plan artifact/user-facing-integration-plan.json \
            --codebook artifact/POKEBLOCK_SAFE_SOURCE_CODEBOOK.json \
            --source-prefix data/maps/ \
            --priority-source-prefix data/maps/InsideOfTruck/ \
            --priority-source-prefix data/maps/LittlerootTown/ \
            --priority-source-prefix data/maps/Route101/ \
            --priority-source-prefix data/maps/OldaleTown/ \
            --priority-source-prefix data/maps/Route102/ \
            --priority-source-prefix data/maps/PetalburgCity/ \
            --priority-source-prefix data/maps/RustboroCity/ \
            --limit 1000 \
            --auto-wrap \
            --apply \
            --report artifact/SOURCE_LEVEL_VIETNAMESE_PILOT.json
          python3 - <<'PY'
          import json
          d=json.load(open("artifact/SOURCE_LEVEL_VIETNAMESE_PILOT.json"))
          assert 700 <= d["labels_staged"] <= 1000 and d["mode"]=="apply", d
          names = {entry["label"] for entry in d["translated"]}
          assert "InsideOfTruck_Text_BoxPrintedWithMonLogo" in names, "Moving-truck box description not compiled in source"
          print("Source-level Vietnamese map pilot rows:",d["labels_staged"],"reflowed:",d["auto_wrapped_labels"])
          PY
          python3 tools/stage_source_ui_translations.py \
            --workspace source-localization-smoke \
            --plan artifact/user-facing-integration-plan.json \
            --codebook artifact/POKEBLOCK_SAFE_SOURCE_CODEBOOK.json \
            --limit 80 \
            --auto-wrap \
            --exclude-label gText_MoveOkBack \
            --exclude-label gText_YesNo \
            --apply \
            --report artifact/SOURCE_LEVEL_UI_PILOT.json
          python3 - <<'PY'
          import json
          d = json.load(open("artifact/SOURCE_LEVEL_UI_PILOT.json"))
          assert 40 <= d["labels_staged"] <= 80 and d["mode"] == "apply", d
          print("Source-level C UI text pilot rows:", d["labels_staged"],"reflowed:",d["auto_wrapped_labels"])
          PY
          python3 tools/stage_dynamic_map_translations.py \
            --workspace source-localization-smoke \
            --plan artifact/user-facing-integration-plan.json \
            --codebook artifact/POKEBLOCK_SAFE_SOURCE_CODEBOOK.json \
            --charmap source-localization-smoke/charmap.txt \
            --source-prefix data/maps/ \
            --priority-source-prefix data/maps/InsideOfTruck/ \
            --priority-source-prefix data/maps/LittlerootTown/ \
            --priority-source-prefix data/maps/Route101/ \
            --priority-source-prefix data/maps/OldaleTown/ \
            --priority-source-prefix data/maps/Route102/ \
            --priority-source-prefix data/maps/PetalburgCity/ \
            --priority-source-prefix data/maps/RustboroCity/ \
            --limit 200 \
            --auto-wrap \
            --apply \
            --report artifact/SOURCE_LEVEL_DYNAMIC_PILOT.json
          python3 - <<'PY'
          import json
          d=json.load(open("artifact/SOURCE_LEVEL_DYNAMIC_PILOT.json"))
          assert 100 <= d["labels_staged"] <= 200 and d["mode"]=="apply", d
          assert d["placeholder_order_preserved"] and d["source_control_bytes_pinned"], d
          names = {entry["label"] for entry in d["accepted"]}
          assert "LittlerootTown_Text_OurNewHomeLetsGoInside" in names, "Missing Mom intro source translation"
          assert "LittlerootTown_Text_WaitPlayer" in names, "Missing Mom WaitPlayer source translation"
          print("Source dynamic PLAYER/RIVAL labels:",d["labels_staged"],"reflowed:",d["auto_wrapped_labels"])
          PY
          python3 tools/stage_source_map_translations.py \
            --workspace source-localization-smoke \
            --plan artifact/user-facing-integration-plan.json \
            --codebook artifact/POKEBLOCK_SAFE_SOURCE_CODEBOOK.json \
            --source-prefix data/text/ \
            --category battle \
            --limit 200 \
            --auto-wrap \
            --apply \
            --report artifact/SOURCE_LEVEL_BATTLE_PILOT.json
          python3 - <<'PY'
          import json
          d=json.load(open("artifact/SOURCE_LEVEL_BATTLE_PILOT.json"))
          assert 100 <= d["labels_staged"] <= 200 and d["category"]=="battle" and d["mode"]=="apply",d
          assert all(x["source_file"].startswith("data/text/") for x in d["translated"])
          print("Source battle text labels:",d["labels_staged"],"reflowed:",d["auto_wrapped_labels"])
          PY
          python3 tools/stage_source_battle_c_messages.py \
            --workspace source-localization-smoke \
            --plan artifact/user-facing-integration-plan.json \
            --codebook artifact/POKEBLOCK_SAFE_SOURCE_CODEBOOK.json \
            --limit 80 \
            --auto-wrap \
            --apply \
            --report artifact/SOURCE_LEVEL_BATTLE_C_PILOT.json
          python3 - <<'PY'
          import json
          d=json.load(open("artifact/SOURCE_LEVEL_BATTLE_C_PILOT.json"))
          assert 15 <= d["labels_staged"] <= 80 and d["mode"]=="apply",d
          assert not d["battle_variables_touched"],d
          print("Static source battle C texts:",d["labels_staged"],"reflowed:",d["auto_wrapped_labels"])
          PY
          python3 tools/stage_source_descriptions.py \
            --workspace source-localization-smoke \
            --plan artifact/user-facing-integration-plan.json \
            --codebook artifact/POKEBLOCK_SAFE_SOURCE_CODEBOOK.json \
            --kind move \
            --limit 355 \
            --rebalance \
            --apply \
            --report artifact/SOURCE_LEVEL_MOVE_DESC_PILOT.json
          python3 tools/stage_source_descriptions.py \
            --workspace source-localization-smoke \
            --plan artifact/user-facing-integration-plan.json \
            --codebook artifact/POKEBLOCK_SAFE_SOURCE_CODEBOOK.json \
            --kind item \
            --limit 310 \
            --apply \
            --report artifact/SOURCE_LEVEL_ITEM_DESC_PILOT.json
          python3 - <<'PY'
          import json
          for kind, minimum in (("MOVE",50),("ITEM",50)):
              d=json.load(open(f"artifact/SOURCE_LEVEL_{kind}_DESC_PILOT.json"))
              assert d["mode"]=="apply" and d["line_box_limits_preserved"],d
              assert d["labels_staged"]>=minimum,d
              if kind=="ITEM":
                  assert d["labels_staged"]==293, d
                  assert d["skipped_reasons"]=={"dynamic/control variable left for separate engine":16},d
              assert all(r["visible_lines"] in ((2,) if kind=="MOVE" else (2,3))
                         for r in d["translated"]),d
              if kind=="MOVE":
                  assert d["labels_staged"]==354, d
                  assert d["auto_rebalanced_labels"]==39, d
                  print("Two-line move rebalances:",d["auto_rebalanced_labels"])
              print(kind,"description translations:",d["labels_staged"],
                    "source file:",d["source_file"])
          PY
          python3 tools/stage_pokeblock_item_descriptions.py \
            --workspace source-localization-smoke \
            --plan artifact/user-facing-integration-plan.json \
            --codebook artifact/POKEBLOCK_SAFE_SOURCE_CODEBOOK.json \
            --charmap source-localization-smoke/charmap.txt \
            --apply \
            --report artifact/SOURCE_LEVEL_POKEBLOCK_ITEM_PILOT.json
          python3 - <<'PY'
          import json
          report=json.load(open("artifact/SOURCE_LEVEL_POKEBLOCK_ITEM_PILOT.json"))
          assert report["mode"]=="apply" and report["labels_staged"]==16,report
          assert report["native_byte_sequence_pinned"] and not report["font_artwork_grafted"]
          assert all(x["native_token_bytes"]=="5556575859" and x["visible_lines"]==3
                     for x in report["translated"]),report
          print("Native POKEBLOCK item descriptions: 16 source labels, exact 5-byte glyph token")
          PY
          python3 tools/verify_compiled_source_strings.py \
            --workspace source-localization-smoke \
            --map artifact/SOURCE_LEVEL_VIETNAMESE_PILOT.json \
            --ui artifact/SOURCE_LEVEL_UI_PILOT.json \
            --dynamic artifact/SOURCE_LEVEL_DYNAMIC_PILOT.json \
            --battle artifact/SOURCE_LEVEL_BATTLE_PILOT.json \
            --battle-c artifact/SOURCE_LEVEL_BATTLE_C_PILOT.json \
            --move-desc artifact/SOURCE_LEVEL_MOVE_DESC_PILOT.json \
            --item-desc artifact/SOURCE_LEVEL_ITEM_DESC_PILOT.json \
            --pokeblock artifact/SOURCE_LEVEL_POKEBLOCK_ITEM_PILOT.json \
            --out artifact/SOURCE_TEXT_INDEPENDENT_QA.json
          python3 tools/apply_title_credit.py source-localization-smoke
          test -s source-localization-smoke/graphics/title_screen/translation_credit.png
          make -C source-localization-smoke -j2
          test -s source-localization-smoke/pokeemerald.gba
          sha256sum source-localization-smoke/pokeemerald.gba > artifact/SOURCE_LEVEL_VIETNAMESE_PILOT_SHA256.txt
          arm-none-eabi-nm -n source-localization-smoke/pokeemerald.elf > artifact/SOURCE_LEVEL_FONT.sym
          python3 tools/audit_source_font_layout.py \
            --rom source-localization-smoke/pokeemerald.gba \
            --sym artifact/SOURCE_LEVEL_FONT.sym \
            --out artifact/SOURCE_LEVEL_FONT_AUDIT.json
          echo "Source-level Vietnamese map staging and assembler/linker pilot: PASS (not runtime/visual certified)." >> "$GITHUB_STEP_SUMMARY"

      - name: Additive second map source batch (experimental; preserve pinned v0.6)
        run: |
          # Clone the already compiled and separately certified 2,093-label
          # source tree. NEVER overwrite the pinned initial GBA/SHA/symbols.
          cp -a source-localization-smoke expanded-map-source-trial
          python3 tools/stage_source_map_translations.py \
            --workspace expanded-map-source-trial \
            --plan artifact/user-facing-integration-plan.json \
            --codebook checkpoints/v06-pokeblock-safe-codebook.json \
            --source-prefix data/maps/ \
            --exclude-report artifact/SOURCE_LEVEL_VIETNAMESE_PILOT.json \
            --limit 1000 \
            --auto-wrap \
            --apply \
            --report artifact/SOURCE_EXPANDED_MAP_STAGE.json
          python3 tools/stage_source_map_translations.py \
            --workspace expanded-map-source-trial \
            --plan artifact/user-facing-integration-plan.json \
            --codebook checkpoints/v06-pokeblock-safe-codebook.json \
            --source-prefix data/maps/ \
            --exclude-report artifact/SOURCE_LEVEL_VIETNAMESE_PILOT.json \
            --exclude-report artifact/SOURCE_EXPANDED_MAP_STAGE.json \
            --only-literal-newlines \
            --normalize-literal-newlines \
            --auto-wrap \
            --limit 1000 \
            --apply \
            --report artifact/SOURCE_EXPANDED_MAP_LF_STAGE.json
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          from verify_compiled_source_strings import validate_stages
          folder=Path("artifact")
          names={
              "map":"SOURCE_LEVEL_VIETNAMESE_PILOT.json",
              "ui":"SOURCE_LEVEL_UI_PILOT.json",
              "dynamic":"SOURCE_LEVEL_DYNAMIC_PILOT.json",
              "battle":"SOURCE_LEVEL_BATTLE_PILOT.json",
              "battle-c":"SOURCE_LEVEL_BATTLE_C_PILOT.json",
              "move-desc":"SOURCE_LEVEL_MOVE_DESC_PILOT.json",
              "item-desc":"SOURCE_LEVEL_ITEM_DESC_PILOT.json",
              "pokeblock":"SOURCE_LEVEL_POKEBLOCK_ITEM_PILOT.json",
          }
          old={k:json.loads((folder/v).read_text()) for k,v in names.items()}
          additional=json.loads((folder/"SOURCE_EXPANDED_MAP_STAGE.json").read_text())
          lf=json.loads((folder/"SOURCE_EXPANDED_MAP_LF_STAGE.json").read_text())
          n=additional["labels_staged"]
          recovered=lf["labels_staged"]
          assert additional["mode"]=="apply" and 50<=n<=1000, additional
          assert additional["previously_staged_label_exclusions"]==1000,additional
          assert lf["mode"]=="apply" and 100<=recovered<=566, lf
          assert lf["previously_staged_label_exclusions"]==1000+n,lf
          assert lf["literal_newlines_normalized"]==recovered,lf
          original_labels={r["label"] for group,report in old.items()
                           for r in report["accepted" if group=="dynamic" else "translated"]}
          extra_labels={r["label"] for r in additional["translated"]}
          lf_labels={r["label"] for r in lf["translated"]}
          assert len(extra_labels)==n and not extra_labels & original_labels,"duplicate source-owner labels"
          assert len(lf_labels)==recovered and not lf_labels & (extra_labels | original_labels), "LF stage overlaps installed labels"
          assert all(r["literal_newlines_normalized"] and
                     "\n" in r["authored_vietnamese"] and
                     r"\n" in r["vietnamese"]
                     for r in lf["translated"]),"unproven LF normalization"
          root=Path("expanded-map-source-trial")
          original_qa=validate_stages(root,old)
          extra_qa=validate_stages(root,{"map":additional})
          lf_qa=validate_stages(root,{"map":lf})
          assert original_qa["checked_unique_source_labels"]==2093,original_qa
          assert extra_qa["checked_unique_source_labels"]==n,extra_qa
          assert lf_qa["checked_unique_source_labels"]==recovered,lf_qa
          result={"previous_compiled_source_labels":2093,"additional_map_source_labels":n,
                  "literal_lf_recovered_source_labels":recovered,
                  "combined_distinct_compiled_labels":2093+n+recovered,
                  "original_payloads_still_valid":True,
                  "additional_source_payloads_valid":True,
                  "literal_lf_payloads_valid":True,
                  "no_cross_batch_duplicate_labels":True,
                  "font_grafted":False,"emulator_tested":False,"release_ready":False}
          (folder/"SOURCE_EXPANDED_MAP_ATTESTATION.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2)+"\n")
          print("PASS: distinct source-owned trial labels",2093+n+recovered,
                "(original 2093 unchanged + new map",n,"+ LF",recovered,")")
          PY
          make -C expanded-map-source-trial -j2
          test -s expanded-map-source-trial/pokeemerald.gba
          sha256sum expanded-map-source-trial/pokeemerald.gba > artifact/SOURCE_EXPANDED_MAP_SHA256.txt
          arm-none-eabi-nm -n expanded-map-source-trial/pokeemerald.elf > artifact/SOURCE_EXPANDED_MAP_FONT.sym
          python3 tools/audit_source_font_layout.py \
            --rom expanded-map-source-trial/pokeemerald.gba \
            --sym artifact/SOURCE_EXPANDED_MAP_FONT.sym \
            --out artifact/SOURCE_EXPANDED_MAP_FONT_AUDIT.json
          echo "Additive map source build compiled, independently source-attested; STOCK font, not a playable Vietnamese release." >> "$GITHUB_STEP_SUMMARY"

      - name: Compile additive source-owned system-text (separate 2560+ trial, stock font)
        run: |
          # Exact 2,560-label map trial is preserved unchanged for rollback.
          cp -a expanded-map-source-trial expanded-system-text-source-trial
          python3 tools/stage_source_map_translations.py \
            --workspace expanded-system-text-source-trial \
            --plan artifact/user-facing-integration-plan.json \
            --codebook checkpoints/v06-pokeblock-safe-codebook.json \
            --source-prefix data/text/ \
            --category system-text \
            --exclude-label gText_Birch_Pokemon \
            --exclude-label gText_Birch_MainSpeech \
            --exclude-label gText_Birch_AreYouReady \
            --priority-source-prefix data/text/cable_club.inc \
            --priority-source-prefix data/text/pkmn_center_nurse.inc \
            --priority-source-prefix data/text/berries.inc \
            --priority-source-prefix data/text/trainers.inc \
            --limit 500 \
            --auto-wrap \
            --apply \
            --report artifact/SOURCE_SYSTEM_TEXT_STAGE.json
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          from verify_compiled_source_strings import validate_stages
          folder=Path("artifact")
          stage=json.loads((folder/"SOURCE_SYSTEM_TEXT_STAGE.json").read_text())
          base=json.loads((folder/"SOURCE_EXPANDED_MAP_ATTESTATION.json").read_text())
          n=stage["labels_staged"]
          assert stage["mode"]=="apply" and stage["category"]=="system-text",stage
          assert stage["explicit_owned_label_exclusions"]==3,stage
          assert 150<=n<=500,stage
          assert base["combined_distinct_compiled_labels"]==2560,base
          assert all(row["source_file"].startswith("data/text/")
                     for row in stage["translated"])
          # The greeting visibly stayed English in the previous six-frame
          # emulator inspection; pin its exact owner and revised source text.
