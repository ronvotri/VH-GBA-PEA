          test -s expanded-system-text-source-trial/pokeemerald.gba
          sha256sum expanded-system-text-source-trial/pokeemerald.gba > artifact/SOURCE_SYSTEM_TEXT_SHA256.txt
          arm-none-eabi-nm -n expanded-system-text-source-trial/pokeemerald.elf > artifact/SOURCE_SYSTEM_TEXT_FONT.sym
          python3 tools/audit_source_font_layout.py \
            --rom expanded-system-text-source-trial/pokeemerald.gba \
            --sym artifact/SOURCE_SYSTEM_TEXT_FONT.sym \
            --out artifact/SOURCE_SYSTEM_TEXT_FONT_AUDIT.json
          echo "System-text incremental source build: compiled/attested but STOCK font; not end-user release." >> "$GITHUB_STEP_SUMMARY"

